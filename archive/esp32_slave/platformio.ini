; PlatformIO Project Configuration File
; TOMS Slave — Passenger Interface & Sensor Node

[platformio]
src_dir = main

[env:esp32s3-slave]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf

; Exact hardware config for ESP32-S3 Super Mini
board_build.mcu         = esp32s3
board_build.f_cpu       = 240000000L
board_build.flash_size  = 4MB
board_build.flash_mode  = qio
board_upload.flash_size = 4MB

; Custom partition table
board_build.partitions  = partitions.csv

; Monitor
monitor_speed = 115200

; Shared library (protocol, crypto, espnow_comm)
lib_extra_dirs = ../shared_lib

build_flags =
    -DLV_CONF_SKIP
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_INFO
    -DLV_LOG_PRINTF=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_USE_CANVAS=1
    -DLV_USE_SPINNER=1
    -DLV_COLOR_DEPTH=16
    -DLV_COLOR_16_SWAP=1
    -DLV_THEME_DEFAULT_DARK=1
