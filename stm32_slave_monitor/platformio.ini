; TOMS — STM32 Blue Pill Slave Monitor
; Receives JSON debug packets from ESP32 Slave over UART2,
; drives status LEDs, and forwards all traffic to PC via USB CDC.
;
; Hardware:
;   Board  : STM32F103C8T6 (Blue Pill)
;   Upload : ST-Link V2
;   USB    : PC13 onboard LED, PA11/PA12 USB D−/D+

[platformio]
default_envs = bluepill_f103c8_maple

; Default environment using USB DFU / Maple bootloader upload
[env:bluepill_f103c8]
platform  = ststm32
board     = bluepill_f103c8
framework = arduino

; Blue Pill USB CDC via STM32duino
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D HAL_PCD_MODULE_ENABLED

board_build.f_cpu = 72000000L

; Since ST-Link is not used, configure upload via USB bootloader (DFU or Maple)
upload_protocol = dfu
; To use Maple bootloader instead, uncomment the line below:
; upload_protocol = maple
; To use serial upload (UART), uncomment the line below:
; upload_protocol = serial

; environment if ST-Link V2 is ever needed
[env:bluepill_f103c8_stlink]
platform  = ststm32
board     = bluepill_f103c8
framework = arduino
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D HAL_PCD_MODULE_ENABLED
board_build.f_cpu = 72000000L
upload_protocol = stlink
debug_tool      = stlink

; Environment for Roger Clark Maple Core with Maple DFU Bootloader
[env:bluepill_f103c8_maple]
platform        = ststm32
board           = genericSTM32F103C8
framework       = arduino
board_build.core = maple
upload_protocol = dfu
build_flags     =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DSERIAL_USB -DGENERIC_BOOTLOADER
