# TOMS Return Machine — Zephyr app configuration
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Bench build: unbonded phones may write and sim_card is enabled. Remove for
# any field build (writes then require an encrypted, bonded link).
CONFIG_TOMS_DEV_MODE=y

# k_thread_stack_space_get(), used by the display thread's alive line
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=n

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_DISPLAY=y

CONFIG_FLASH=y
CONFIG_NVS=y

# BLE peripheral (see firmware/PROTOCOL.md)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_DEVICE_NAME="TOMS-RM"
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_GATT_CLIENT=n

# Stack/heap tuning symbols (MAIN_STACK_SIZE, SYSTEM_WORKQUEUE_STACK_SIZE,
# HEAP_MEM_POOL_SIZE) are not visible in the v4.2 Kconfig universe for this
# board, and WDT_DISABLE_AT_BOOT needs the esp32 wdt driver enabled first —
# revisit both when the watchdog work lands (spike item 6) and on the bench.

# OTA trial boot (OTA_PLAN.md phase 2): confirm/revert, watchdog
CONFIG_WATCHDOG=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y
# Do not let the driver start the watchdog before trial_start() has configured it.
CONFIG_WDT_DISABLE_AT_BOOT=y

# OTA handlers run on the Bluetooth RX thread (ota.c): more than the 1200 B default
CONFIG_BT_RX_STACK_SIZE=2048

# Persist Bluetooth bonds in the storage partition (NVS). Without this the keys live in RAM
# and die at the OTA reboot, so the phone cannot reconnect with its stored key (phase 4 finding).
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y
