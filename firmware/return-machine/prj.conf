# TOMS Return Machine — Zephyr app configuration
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y

CONFIG_FLASH=y
CONFIG_NVS=y

# BLE peripheral (see firmware/PROTOCOL.md)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_DEVICE_NAME="TOMS-RM"
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_GATT_CLIENT=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=32768

# The watchdog is enabled by the app once the health loop exists (spike item 6).
CONFIG_WDT_DISABLE_AT_BOOT=y
