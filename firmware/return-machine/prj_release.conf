# TOMS Return Machine — Production Release Configuration Overlay
# Use with: west build ... -- -DEXTRA_CONF_FILE=prj_release.conf

# Production mode: disable unauthenticated writes and mock card injection
CONFIG_TOMS_DEV_MODE=n

# Enforce secure bonding and encryption for all BLE GATT write operations
# Unbonded centrals attempting to write will receive BT_ATT_ERR_AUTHENTICATION
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
