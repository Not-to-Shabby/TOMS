# TOMS production stack for the OVH VPS. Run from this folder:  docker compose up -d --build
# Only Caddy publishes ports (80 and 443). The web, API and database are reachable only inside the stack.
name: toms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../toms_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in deploy/.env}
      CORS_ORIGINS: ${PUBLIC_BASE_URL}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Manila}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../toms_web
    restart: unless-stopped
    environment:
      TLS_MODE: "off"
      PORT: 8080
      API_UPSTREAM: http://api:3000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
