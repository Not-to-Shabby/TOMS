# TOMS production stack for the OVH VPS. Run from this folder:  docker compose up -d --build
# Only Caddy publishes ports (80 and 443) and sits alone on the front network. Everything else talks on the
# internal back network (web, API, database), which has no route to the internet, and every container runs
# with no-new-privileges.
name: toms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No cap_drop here on purpose: Postgres needs a few capabilities on first start of a fresh volume.
    security_opt: ["no-new-privileges:true"]
    networks:
      - back
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../toms_backend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The image never writes outside /app/uploads (the volume) — multer writes the LTFRB scans straight to
    # uploads/fares and logs go to stdout — so the root filesystem is read-only and /tmp is a small,
    # executable-less scratch space for anything an npm dependency might need one day.
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    networks:
      - back
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in deploy/.env}
      CORS_ORIGINS: ${PUBLIC_BASE_URL}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Manila}
      # Caddy sets X-Forwarded-For to the client's address (replacing anything the client sent) and nginx appends the
      # address it sees, so the real client is the second address from the right. Change this only if a proxy is added or removed.
      TRUST_PROXY_HOPS: 2
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../toms_web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - front
      - back
    environment:
      TLS_MODE: "off"
      PORT: 8080
      API_UPSTREAM: http://api:3000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Caddy only ever binds 80/443 and serves from its volumes, so it needs nothing beyond NET_BIND_SERVICE.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      - front
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  front:
  back:
    internal: true
