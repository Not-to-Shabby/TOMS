name: toms_mobile
description: "TOMS - Transportation Occupancy Monitoring System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # USB Serial communication with ESP32 Master
  usb_serial: ^0.5.1

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.1

  # JSON parsing
  intl: ^0.20.2

  # UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # GPS & Location Services
  geolocator: ^13.0.1
  permission_handler: ^11.3.0

  # Alerts & Alarms
  vibration: ^3.1.2
  flutter_local_notifications: ^17.2.2

  # Sync & Communication
  http: ^1.2.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  share_plus: ^10.0.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stops.json
    - assets/vehicles.json
